<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // apply saved / system theme before first paint
      try {
        var t = localStorage.getItem('forgeflow.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      .boot { position: fixed; inset: 0; background: #f6f8fb; }
      :root[data-theme='dark'] .boot { background: #0b1018; }
      .boot img { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; }
      .boot-spin { position: absolute; left: 50%; top: calc(50% + 70px); width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 3px solid rgba(5, 148, 148, 0.22); border-top-color: #059494; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <title>ForgeFlow ERP — Forging &amp; Casting Manufacturing</title>
  </head>
  <body>
    <div id="root">
      <!-- shown until the app has started; React replaces it. Same look as the native splash and the in-app loading screen. -->
      <div class="boot" role="status" aria-label="Loading">
        <img src="/app-icon.png" alt="" width="96" height="96" />
        <div class="boot-spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
